[package]
name = "droplet-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
shell-words = "1"
tempfile = "3"
thiserror = "2"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
tokio = { version = "1", features = ["net", "time", "sync", "io-util", "macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
