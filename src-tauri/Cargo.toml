[package]
name = "droplet"
version = "0.1.0"
description = "A little desktop companion for your SSH connections"
edition = "2021"
rust-version = "1.98"

[lib]
name = "droplet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
shell-words = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"
