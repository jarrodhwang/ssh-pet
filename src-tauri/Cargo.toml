[package]
name = "droplet"
version = "0.2.0"
description = "A little desktop companion for your SSH connections"
edition = "2021"
rust-version = "1.98"

[lib]
name = "droplet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
droplet-core = { path = "../crates/droplet-core" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util"] }
